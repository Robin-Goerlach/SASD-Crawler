name: ci

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows .NET 8
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.425'

      - name: Restore
        run: dotnet restore Sasd.Crawler.sln

      - name: Verify formatting
        run: dotnet format Sasd.Crawler.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Sasd.Crawler.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Sasd.Crawler.sln --configuration Release --no-build --no-restore --logger "trx;LogFileName=tests.trx"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
